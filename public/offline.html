<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tapak Nusa — Mode offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #ffffff;
        color: #17352d;
        font-family:
          'DM Sans',
          -apple-system,
          'Segoe UI',
          Arial,
          sans-serif;
      }
      .card {
        width: min(420px, 100%);
        padding: 32px 26px;
        border: 1px solid #eee3d4;
        border-radius: 24px;
        background: linear-gradient(160deg, #fffdf8, #ffffff);
        box-shadow: 0 20px 60px rgba(21, 62, 48, 0.12);
        text-align: center;
      }
      .mark {
        width: 54px;
        height: 60px;
        margin: 0 auto 18px;
        border-radius: 50% 50% 50% 8px;
        background: #df2029;
        display: grid;
        place-items: center;
        transform: rotate(-45deg);
        box-shadow: 0 8px 20px rgba(195, 28, 36, 0.24);
      }
      .mark span {
        transform: rotate(45deg);
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        line-height: 1;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        color: #5f6f69;
        font-size: 13px;
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-radius: 14px;
        background: #df2029;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      small {
        display: block;
        margin-top: 16px;
        color: #93a09a;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark"><span>T</span></div>
      <h1>Kamu sedang offline</h1>
      <p>
        Tapak Nusa belum bisa memuat halaman baru tanpa koneksi internet. Halaman yang pernah dibuka
        tetap dapat diakses.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
      <small>Petualangan budaya Indonesia</small>
    </main>
  </body>
</html>
